name: Deploy Ollie receiver
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ollie-receiver-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check receiver
        run: node --test automation/ollie/cloudflare/worker.test.mjs
      - name: Deploy free HTTP receiver
        working-directory: automation/ollie/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OLLIE_CONFIG_JSON: ${{ secrets.OLLIE_KPI_CONFIG_JSON }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN in Actions secrets'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID in Actions secrets'; exit 1; }
          test -n "$OLLIE_CONFIG_JSON" || { echo 'Missing OLLIE_KPI_CONFIG_JSON in Actions secrets'; exit 1; }
          npx --yes wrangler@4 deploy
          printf '%s' "$OLLIE_CONFIG_JSON" | npx --yes wrangler@4 secret put OLLIE_CONFIG_JSON
