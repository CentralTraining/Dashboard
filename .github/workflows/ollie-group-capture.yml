name: Ollie group notices
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ollie-kpi-daily
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and verified DingTalk CLI
        working-directory: automation/ollie
        run: |
          python -m pip install -r requirements-github.txt
          python install_dws.py
      - name: Check group identity and deadline rules
        working-directory: automation/ollie
        run: python -m unittest test_group_capture test_deadlines
      - name: Capture leader notices without sending reminders
        working-directory: automation/ollie
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLLIE_KPI_CONFIG_JSON: ${{ secrets.OLLIE_KPI_CONFIG_JSON }}
        run: python group_capture.py
