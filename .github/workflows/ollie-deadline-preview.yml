name: One-off leader deadline preview

on:
  push:
    branches: [ollie-oneoff-leader-preview-20261024-0150]

permissions:
  contents: read

concurrency:
  group: ollie-kpi-daily
  cancel-in-progress: false

jobs:
  one-private-preview:
    if: github.event.created == true && github.event.deleted == false && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r automation/ollie/requirements-github.txt
      - name: Check one-off leader-only safeguards
        working-directory: automation/ollie
        run: python -m unittest test_leader_deadline_preview
      - name: Send the single requested private preview
        working-directory: automation/ollie
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLLIE_KPI_CONFIG_JSON: ${{ secrets.OLLIE_KPI_CONFIG_JSON }}
        run: python leader_deadline_preview.py
