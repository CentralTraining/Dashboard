name: One-off approved Find X10 notice recovery
on:
  push:
    branches: [ollie-oneoff-findx10-recovery-20261024-0215]
permissions:
  contents: write
concurrency:
  group: ollie-kpi-daily
  cancel-in-progress: false
jobs:
  restore-approved-notice:
    if: github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies and verified DingTalk CLI
        working-directory: automation/ollie
        run: |
          python -m pip install -r requirements-github.txt
          python install_dws.py
      - name: Verify single-notice restoration guards
        working-directory: automation/ollie
        run: python -m unittest test_findx10_notice_recovery
      - name: Restore only the explicitly approved notice without sending messages
        working-directory: automation/ollie
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLLIE_KPI_CONFIG_JSON: ${{ secrets.OLLIE_KPI_CONFIG_JSON }}
        run: python findx10_notice_recovery.py
